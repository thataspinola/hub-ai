appFramework: react
ingress:
  enabled: true
  contextURL: /react-ssr-corp-hubv-painel-administrativo
  host: ''

namespace: corp-hubv
containerPort: 3000

hpa:
  #Número mínimo de PODS
  minReplicas: 1
  #Número máximo de PODS
  maxReplicas: 5
  #Porcentagem de média para escalar o POD (Quando bater a média de consumo o POD escala!), melhores detalhes consultar a documentação.
  targetMemoryUtilizationPercentage: 70

# Habilita ou não as secrets que são "puxadas" através do Backstage
enable_secrets: false

configmap:
  profile: 'hml'
  KEYCLOAK_CLIENT_ID: 'adhml'
  KEYCLOAK_CLIENT_S: ''
  KEYCLOAK_ISSUER: 'https://sso-interno.authcorp.hml.awsporto/auth/realms/adhml'
  NEXTAUTH_URL: 'https://apps.appsarquitetura.hml.awsporto/react-ssr-corp-hubv-painel-administrativo/api/auth'
  NEXTAUTH_S: 'my-secret-abc-123'
  NEXTAUTH_LOGOUT: 'https://sso-interno.authcorp.hml.awsporto/auth/realms/adhml/protocol/openid-connect/logout'
  NEXT_PUBLIC_API: 'https://apps.appsarquitetura.hml.awsporto/sboot-corp-arqt-aplicacao-referencia'
  S3_BUCKET: 'porto-seguro-pages-s3--hml'
  AWS_REGION: 'ca-central-1'
  S3_PATH_PREFIX_HML: 'assets/feature-flags/{project}/flags.json'
  FEATURE_FLAGS_CACHE_CONTROL: 'max-age=60'
