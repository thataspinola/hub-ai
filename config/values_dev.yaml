appFramework: react
ingress:
  enabled: true
  contextURL: /react-ssr-corp-hubv-painel-administrativo
  host: ''

namespace: corp-hubv
containerPort: 3000

hpa:
  enabled: true
  enableMemory: false
  enableCpu: true
  #Número mínimo de PODS
  minReplicas: 1
  #Número máximo de PODS
  maxReplicas: 2
  #Porcentagem de média para escalar o POD (Quando bater a média de consumo o POD escala!), melhores detalhes consultar a documentação.
  targetMemoryUtilizationPercentage: 85
  targetCpuUtilizationPercentage: 85

resources:
  cpu: 250m
  memory: 500Mi

# Habilita ou não as secrets que são "puxadas" através do Backstage
enable_secrets: false

configmap:
  profile: 'dev'
  KEYCLOAK_CLIENT_ID: 'addev'
  KEYCLOAK_CLIENT_S: ''
  KEYCLOAK_ISSUER: 'https://sso-interno.authcorp.dev.awsporto/auth/realms/addev'
  NEXTAUTH_URL: 'https://apps.appsarquitetura.dev.awsporto/react-ssr-corp-hubv-painel-administrativo/api/auth'
  NEXTAUTH_S: 'my-secret-abc-123'
  NEXTAUTH_LOGOUT: 'https://sso-interno.authcorp.dev.awsporto/auth/realms/addev/protocol/openid-connect/logout'
  NEXT_PUBLIC_API: 'https://apps4.appsarquitetura.dev.awsporto/sboot-corp-arqt-aplicacao-referencia'
  S3_BUCKET: 'porto-seguro-pages-s3--hml'
  AWS_REGION: 'ca-central-1'
