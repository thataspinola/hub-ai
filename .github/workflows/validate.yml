name: Validate hub resources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/test_install.py
      - run: python scripts/test_validation.py
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm --prefix examples/node-backend test
      - run: npm --prefix examples/node-backend run test:automated
      - run: npm --prefix examples/node-backend run test:e2e
