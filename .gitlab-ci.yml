# Hub quality checks only; does not replace an existing Jenkins delivery pipeline.
stages:
  - validate
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
validate-resources:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m pip install -r requirements-dev.txt
    - python scripts/validate.py
    - python scripts/test_install.py
    - python scripts/test_validation.py
node-examples:
  stage: validate
  image: node:${NODE_VERSION}-bookworm-slim
  parallel:
    matrix:
      - NODE_VERSION: ['22', '24']
  script:
    - npm --prefix examples/node-backend test
    - npm --prefix examples/node-backend run test:automated
    - npm --prefix examples/node-backend run test:e2e
